version: "2"

# Everything enabled here is green over the whole package. What this package
# decided against is switched off below with the reason, rather than silenced
# one `//nolint` at a time.

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # The idiom half, one linter per family:
    - errorlint # a type switch or == on an error cannot see a wrapped one
    - gocritic # the shadowed builtin, the init clause that tests nothing
    - revive # the exported/return/naming rules of Go Code Review Comments
    - intrange # for i := 0; i < n; i++
    - copyloopvar # the pre-1.22 `x := x`
    - usestdlibvars
    - wastedassign
    - makezero
    - durationcheck
    - iface

  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: bool-literal-in-expr
        - name: identical-branches
        - name: modifies-value-receiver
        - name: string-of-int
        - name: unnecessary-stmt
        - name: useless-break
        - name: waitgroup-by-value
        - name: duplicated-imports
        - name: optimize-operands-order

    gocritic:
      enable-all: true
      disabled-checks:
        # Result lists are named where a name says something the type does not,
        # and `([]int64, []int16, [][]byte)` would be the types again.
        - unnamedResult

    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aromanovich/pgnotch

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
